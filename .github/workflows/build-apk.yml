name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discipline-app
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Java17环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 给gradlew增加执行权限
        run: chmod +x gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: discipline-app/app/build/outputs/apk/debug/app-debug.apk
